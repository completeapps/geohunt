<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GeoHunt Explorer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 1280px;
      height: 100%;
      max-height: 720px;
      background: #000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Top HUD Overlay */
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-card {
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 12px;
      color: #e0e0e0;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .hud-title {
      color: #4CAF50;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* Buttons */
    .btn {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: #388e3c;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: #424242;
    }

    .btn-secondary:hover {
      background: #616161;
    }

    /* GPS Unit UI Component */
    #gps-display {
      background: #0d1b0e;
      border: 2px solid #2e7d32;
      color: #4CAF50;
      font-family: 'Courier New', Courier, monospace;
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: inset 0 0 8px rgba(76, 175, 80, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .signal-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4CAF50;
      box-shadow: 0 0 8px #4CAF50;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    /* Action Hotbar */
    #action-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    /* Modals & Overlays */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #222;
      border: 1px solid #444;
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      max-height: 85%;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    /* Notebook Style Modal */
    .notebook-style {
      background: #fbf5e5;
      color: #2c251e;
      border: 2px solid #8c6d46;
      box-shadow: inset 0 0 20px rgba(140, 109, 70, 0.2);
      font-family: 'Georgia', serif;
    }

    .notebook-header {
      border-bottom: 2px dashed #8c6d46;
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notebook-title {
      font-size: 20px;
      font-weight: bold;
      color: #5c4028;
    }

    .cache-list-item {
      background: rgba(140, 109, 70, 0.1);
      border: 1px solid rgba(140, 109, 70, 0.3);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cache-info h4 {
      margin-bottom: 4px;
      color: #3b2818;
    }

    .cache-info p {
      font-size: 12px;
      color: #6e553c;
    }

    /* Logbook Form */
    .logbook-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      margin-top: 6px;
      outline: none;
    }

    .logbook-signatures {
      max-height: 150px;
      overflow-y: auto;
      border: 1px inset #ddd;
      padding: 8px;
      background: #fff;
      border-radius: 6px;
      font-size: 13px;
    }

    .sig-entry {
      padding: 4px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      word-break: break-all;
    }

    /* Mobile Controls Overlay */
    #mobile-controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      top: 20px;
      pointer-events: none;
      z-index: 20;
      display: none; /* Auto-enabled on touch/mobile width */
    }

    .dpad {
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: 140px;
      height: 140px;
      pointer-events: auto;
    }

    .dpad-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
      touch-action: manipulation;
    }

    .dpad-btn:active {
      background: rgba(76, 175, 80, 0.6);
    }

    .dpad-up { top: 0; left: 48px; }
    .dpad-down { bottom: 0; left: 48px; }
    .dpad-left { top: 48px; left: 0; }
    .dpad-right { top: 48px; right: 0; }

    .action-touch-btn {
      position: absolute;
      bottom: 20px;
      right: 10px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(76, 175, 80, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .action-touch-btn:active {
      background: rgba(76, 175, 80, 0.8);
      transform: scale(0.95);
    }

    /* Legal / Safety Disclaimer Footer */
    #legal-disclaimer {
      position: absolute;
      bottom: 2px;
      width: 100%;
      text-align: center;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Top HUD -->
    <div id="hud">
      <div class="hud-card">
        <span class="hud-title">GeoHunt</span>
        <span id="caches-found-text">Found: 0 / 5</span>
      </div>

      <!-- GPS Inventory Item Display -->
      <div id="gps-display" style="display: flex;">
        <div class="signal-indicator"></div>
        <div>
          <div style="font-size: 9px; opacity: 0.8;">GPS NAVIGATION</div>
          <div id="gps-status-text">SIGNAL: ACTIVE</div>
        </div>
      </div>

      <div class="hud-card">
        <button class="btn btn-secondary" id="graphics-toggle-btn">Graphics: High</button>
      </div>
    </div>

    <!-- Action Hotbar -->
    <div id="action-bar">
      <button class="btn" id="notebook-btn">📖 Open Notebook</button>
      <button class="btn btn-secondary" id="gps-toggle-btn">📡 Toggle GPS</button>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="mobile-controls">
      <div class="dpad">
        <div class="dpad-btn dpad-up" id="btn-up">▲</div>
        <div class="dpad-btn dpad-down" id="btn-down">▼</div>
        <div class="dpad-btn dpad-left" id="btn-left">◄</div>
        <div class="dpad-btn dpad-right" id="btn-right">►</div>
      </div>
      <div class="action-touch-btn" id="btn-interact">SEARCH</div>
    </div>

    <!-- Trademark Safety Disclaimer -->
    <div id="legal-disclaimer">
      This game is an independent work and is not affiliated with, endorsed by, or associated with Geocaching / Groundspeak Inc.
    </div>

    <!-- Notebook Modal -->
    <div class="modal-overlay" id="notebook-modal">
      <div class="modal-box notebook-style">
        <div class="notebook-header">
          <span class="notebook-title">Explorer Notebook</span>
          <button class="btn btn-secondary" id="close-notebook-btn">✖ Close</button>
        </div>
        <p style="font-size: 13px; font-style: italic;">Select a cache waypoint to direct your GPS compass toward it.</p>
        <div id="notebook-cache-list">
          <!-- Dynamic Cache List Entries -->
        </div>
      </div>
    </div>

    <!-- Logbook Modal -->
    <div class="modal-overlay" id="logbook-modal">
      <div class="modal-box notebook-style">
        <div class="notebook-header">
          <span class="notebook-title" id="logbook-cache-title">Cache Found!</span>
          <button class="btn btn-secondary" id="close-logbook-btn">✖ Close Without Signing</button>
        </div>
        <p id="logbook-cache-desc" style="font-size: 13px;"></p>
        
        <div>
          <label style="font-size: 12px; font-weight: bold; color: #5c4028;">Sign Logbook:</label>
          <input type="text" id="player-name-input" class="logbook-input" placeholder="Enter your callsign / handle..." maxlength="40">
        </div>

        <div>
          <label style="font-size: 12px; font-weight: bold; color: #5c4028; display: block; margin-bottom: 4px;">Past Visitors:</label>
          <div class="logbook-signatures" id="logbook-signatures-list">
            <!-- Dynamic Past Signatures -->
          </div>
        </div>

        <button class="btn" id="sign-logbook-btn" style="width: 100%; justify-content: center;">✍️ Sign Logbook & Claim Cache</button>
      </div>
    </div>
  </div>

  <script>
    // --- Game Configuration & State ---
    const CANVAS_WIDTH = 1280;
    const CANVAS_HEIGHT = 720;
    const MAP_SIZE = 3000;

    const state = {
      highGraphics: true,
      gpsActive: true,
      activeWaypointIndex: 0,
      cachesFound: 0,
      activeModal: null,
      activeCacheNear: null,
      keys: {},
      touchDirs: { up: false, down: false, left: false, right: false }
    };

    // Camera setup
    const camera = { x: 0, y: 0, width: CANVAS_WIDTH, height: CANVAS_HEIGHT };

    // Player setup
    const player = {
      x: MAP_SIZE / 2,
      y: MAP_SIZE / 2,
      radius: 16,
      speed: 4.5,
      angle: 0
    };

    // Procedural Caches
    const caches = [
      { id: 1, name: "Mossy Boulder Cache", hint: "Hidden under a large rock formation near the northern woods.", x: 1200, y: 1100, found: false, signatures: ["TrailBlazer_99", "PineSeeker"] },
      { id: 2, name: "Old Hollow Tree Micro", hint: "Tucked inside the hollow trunk of an ancient oak.", x: 2200, y: 800, found: false, signatures: ["ForestRambler", "GeoGeo_X"] },
      { id: 3, name: "River Bank Container", hint: "Look along the southern gravel embankment.", x: 800, y: 2300, found: false, signatures: ["MuddyBoots", "WanderLust"] },
      { id: 4, name: "Overlook Lock-Box", hint: "High elevation near the eastern cliff edges.", x: 2500, y: 2200, found: false, signatures: ["PeakFinder"] },
      { id: 5, name: "Pine Grove Cache", hint: "Nestled beneath heavy pine needle coverage.", x: 1500, y: 2600, found: false, signatures: ["CompassKid"] }
    ];

    // Environment Decor Elements (Trees, Rocks)
    const environment = [];
    function generateEnvironment() {
      // Seeded-style random scenery generation
      for (let i = 0; i < 200; i++) {
        environment.push({
          type: 'tree',
          x: Math.random() * MAP_SIZE,
          y: Math.random() * MAP_SIZE,
          size: 25 + Math.random() * 20
        });
      }
      for (let i = 0; i < 100; i++) {
        environment.push({
          type: 'rock',
          x: Math.random() * MAP_SIZE,
          y: Math.random() * MAP_SIZE,
          size: 12 + Math.random() * 14
        });
      }
    }
    generateEnvironment();

    // Ultra Graphics Assets: Ambient Life (Birds, Pollen)
    const birds = Array.from({ length: 8 }, () => ({
      x: Math.random() * MAP_SIZE,
      y: Math.random() * MAP_SIZE,
      speed: 2 + Math.random() * 2,
      angle: Math.random() * Math.PI * 2,
      wingCycle: Math.random() * Math.PI
    }));

    const pollenParticles = Array.from({ length: 60 }, () => ({
      x: Math.random() * MAP_SIZE,
      y: Math.random() * MAP_SIZE,
      size: 1 + Math.random() * 2,
      alpha: 0.2 + Math.random() * 0.5,
      driftSpeed: 0.3 + Math.random() * 0.5
    }));

    // Setup Canvas
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;

    // Detect Touch Capability
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0 || window.innerWidth < 800) {
      document.getElementById('mobile-controls').style.display = 'block';
    }

    // --- Input Handling ---
    window.addEventListener('keydown', (e) => {
      state.keys[e.key.toLowerCase()] = true;
      if (e.key === 'e' || e.key === 'E' || e.key === ' ') {
        checkCacheInteraction();
      }
    });

    window.addEventListener('keyup', (e) => {
      state.keys[e.key.toLowerCase()] = false;
    });

    // Touch D-Pad Controls
    function bindTouchBtn(elementId, dirKey) {
      const btn = document.getElementById(elementId);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); state.touchDirs[dirKey] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); state.touchDirs[dirKey] = false; });
      btn.addEventListener('mousedown', () => { state.touchDirs[dirKey] = true; });
      btn.addEventListener('mouseup', () => { state.touchDirs[dirKey] = false; });
    }

    bindTouchBtn('btn-up', 'up');
    bindTouchBtn('btn-down', 'down');
    bindTouchBtn('btn-left', 'left');
    bindTouchBtn('btn-right', 'right');

    document.getElementById('btn-interact').addEventListener('touchstart', (e) => {
      e.preventDefault();
      checkCacheInteraction();
    });
    document.getElementById('btn-interact').addEventListener('click', () => {
      checkCacheInteraction();
    });

    // UI Buttons & Modals
    const graphicsBtn = document.getElementById('graphics-toggle-btn');
    graphicsBtn.addEventListener('click', () => {
      state.highGraphics = !state.highGraphics;
      graphicsBtn.textContent = `Graphics: ${state.highGraphics ? 'High' : 'Low'}`;
    });

    const gpsToggleBtn = document.getElementById('gps-toggle-btn');
    const gpsDisplay = document.getElementById('gps-display');
    gpsToggleBtn.addEventListener('click', () => {
      state.gpsActive = !state.gpsActive;
      gpsDisplay.style.display = state.gpsActive ? 'flex' : 'none';
    });

    const notebookBtn = document.getElementById('notebook-btn');
    const notebookModal = document.getElementById('notebook-modal');
    const closeNotebookBtn = document.getElementById('close-notebook-btn');

    notebookBtn.addEventListener('click', () => openModal('notebook-modal'));
    closeNotebookBtn.addEventListener('click', () => closeModal('notebook-modal'));

    const logbookModal = document.getElementById('logbook-modal');
    const closeLogbookBtn = document.getElementById('close-logbook-btn');
    closeLogbookBtn.addEventListener('click', () => closeModal('logbook-modal'));

    function openModal(id) {
      document.getElementById(id).classList.add('active');
      state.activeModal = id;
      if (id === 'notebook-modal') renderNotebookList();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      state.activeModal = null;
    }

    // --- Notebook Logic ---
    function renderNotebookList() {
      const listContainer = document.getElementById('notebook-cache-list');
      listContainer.innerHTML = '';

      caches.forEach((c, idx) => {
        const item = document.createElement('div');
        item.className = 'cache-list-item';
        item.innerHTML = `
          <div class="cache-info">
            <h4>${c.found ? '✅' : '📌'} ${c.name}</h4>
            <p><strong>Hint:</strong> ${c.hint}</p>
            <p><strong>Status:</strong> ${c.found ? 'Logged & Completed' : 'Unfound'}</p>
          </div>
          <div>
            ${state.activeWaypointIndex === idx ? 
              `<button class="btn btn-secondary" disabled>Tracking</button>` : 
              `<button class="btn" onclick="setWaypoint(${idx})">Set Waypoint</button>`}
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    window.setWaypoint = function(idx) {
      state.activeWaypointIndex = idx;
      renderNotebookList();
      closeModal('notebook-modal');
    };

    // --- Cache Interaction & Logbook Signing ---
    function checkCacheInteraction() {
      if (state.activeModal) return;

      const targetCache = caches[state.activeWaypointIndex];
      const dist = Math.hypot(player.x - targetCache.x, player.y - targetCache.y);

      if (dist < 45) {
        openLogbook(targetCache);
      } else {
        // Find if near any cache
        const nearCache = caches.find(c => Math.hypot(player.x - c.x, player.y - c.y) < 45);
        if (nearCache) {
          openLogbook(nearCache);
        }
      }
    }

    function openLogbook(cache) {
      state.activeCacheNear = cache;
      document.getElementById('logbook-cache-title').textContent = cache.name;
      document.getElementById('logbook-cache-desc').textContent = cache.hint;

      const sigList = document.getElementById('logbook-signatures-list');
      sigList.innerHTML = cache.signatures.map(s => `<div class="sig-entry"><span>👤 ${s}</span><span>Logged</span></div>`).join('');

      openModal('logbook-modal');
    }

    document.getElementById('sign-logbook-btn').addEventListener('click', () => {
      const nameInput = document.getElementById('player-name-input');
      const playerName = nameInput.value.trim() || 'Anonymous Explorer';

      if (state.activeCacheNear) {
        if (!state.activeCacheNear.found) {
          state.activeCacheNear.found = true;
          state.cachesFound++;
          document.getElementById('caches-found-text').textContent = `Found: ${state.cachesFound} / ${caches.length}`;
        }
        state.activeCacheNear.signatures.push(playerName);
      }

      nameInput.value = '';
      closeModal('logbook-modal');
    });

    // --- Main Game Loop & Rendering ---
    function update() {
      if (state.activeModal) return; // Freeze movement when modal open

      // Calculate directional input
      let dx = 0;
      let dy = 0;

      if (state.keys['w'] || state.keys['arrowup'] || state.touchDirs.up) dy -= 1;
      if (state.keys['s'] || state.keys['arrowdown'] || state.touchDirs.down) dy += 1;
      if (state.keys['a'] || state.keys['arrowleft'] || state.touchDirs.left) dx -= 1;
      if (state.keys['d'] || state.keys['arrowright'] || state.touchDirs.right) dx += 1;

      if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
      }

      player.x += dx * player.speed;
      player.y += dy * player.speed;

      // Keep inside map limits
      player.x = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.y));

      if (dx !== 0 || dy !== 0) {
        player.angle = Math.atan2(dy, dx);
      }

      // Camera follows player
      camera.x = player.x - camera.width / 2;
      camera.y = player.y - camera.height / 2;

      // Update ambient life in high graphics
      if (state.highGraphics) {
        birds.forEach(b => {
          b.x += Math.cos(b.angle) * b.speed;
          b.y += Math.sin(b.angle) * b.speed;
          b.wingCycle += 0.15;
          if (b.x < 0 || b.x > MAP_SIZE || b.y < 0 || b.y > MAP_SIZE) {
            b.x = Math.random() * MAP_SIZE;
            b.y = Math.random() * MAP_SIZE;
          }
        });

        pollenParticles.forEach(p => {
          p.x += p.driftSpeed;
          if (p.x > MAP_SIZE) p.x = 0;
        });
      }

      // Update GPS UI status
      if (state.gpsActive) {
        const activeCache = caches[state.activeWaypointIndex];
        const dist = Math.round(Math.hypot(player.x - activeCache.x, player.y - activeCache.y));
        document.getElementById('gps-status-text').textContent = `${activeCache.name.substring(0, 12)}... | ${dist}m`;
      }
    }

    function render() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      ctx.save();
      ctx.translate(-camera.x, -camera.y);

      // 1. Terrain Base
      ctx.fillStyle = '#3a5a40';
      ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

      // High Graphics Grid & Dynamic Lighting
      if (state.highGraphics) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        for (let x = 0; x < MAP_SIZE; x += 100) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
        }
        for (let y = 0; y < MAP_SIZE; y += 100) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
        }
      }

      // 2. Render Environment (Rocks & Trees with Shadows in High Mode)
      environment.forEach(e => {
        if (state.highGraphics) {
          // Dynamic directional shadow
          ctx.fillStyle = 'rgba(0,0,0,0.25)';
          ctx.beginPath();
          ctx.ellipse(e.x + 10, e.y + 10, e.size, e.size * 0.6, Math.PI / 4, 0, Math.PI * 2);
          ctx.fill();
        }

        if (e.type === 'rock') {
          ctx.fillStyle = '#7f8c8d';
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#2d6a4f';
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // 3. Render Waypoint Target Marker
      const activeCache = caches[state.activeWaypointIndex];
      ctx.strokeStyle = activeCache.found ? '#4CAF50' : '#ff9800';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.arc(activeCache.x, activeCache.y, 35, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // 4. Render Player
      if (state.highGraphics) {
        // Player shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.ellipse(player.x + 4, player.y + 6, player.radius, player.radius * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Player Body
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Direction Indicator Line
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(player.x + Math.cos(player.angle) * (player.radius + 8), player.y + Math.sin(player.angle) * (player.radius + 8));
      ctx.stroke();

      // GPS Compass Line to active cache (if active)
      if (state.gpsActive) {
        ctx.strokeStyle = 'rgba(76, 175, 80, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(activeCache.x, activeCache.y);
        ctx.stroke();
      }

      // 5. High Graphics Ambient Extras (Birds & Pollen)
      if (state.highGraphics) {
        // Birds flying
        ctx.fillStyle = '#111';
        birds.forEach(b => {
          const wingOffset = Math.sin(b.wingCycle) * 5;
          ctx.beginPath();
          ctx.moveTo(b.x, b.y);
          ctx.lineTo(b.x - 8, b.y - wingOffset);
          ctx.lineTo(b.x - 8, b.y + wingOffset);
          ctx.fill();
        });

        // Floating Atmospheric Pollen
        ctx.fillStyle = 'rgba(255, 255, 200, 0.5)';
        pollenParticles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
